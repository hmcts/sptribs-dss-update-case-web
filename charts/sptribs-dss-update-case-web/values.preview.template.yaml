nodejs:
  # Don't modify below here
  image: ${IMAGE_NAME}
  ingressHost: ${SERVICE_FQDN}
  environment:
    RATE_LIMITER_DISABLED: true
    CCD_URL: 'http://ccd-data-store-api-sptribs-case-api-pr-2701.preview.platform.hmcts.net'
    CASE_DOCUMENT_API_URL: 'http://ccd-case-document-am-api-sptribs-case-api-pr-2701.preview.platform.hmcts.net'

  keyVaults:
    sptribs:
      secrets:
        - name: app-insights-instrumentation-key-preview
          alias: app-insights-instrumentation-key
        - redis-access-key
        - idam-systemupdate-username
        - idam-systemupdate-password
        - idam-dss-update-ui-secret
        - s2s-case-api-secret
        - sptribs-dss-update-case-dynatrace-url

idam-pr:
  enabled: true
  redirect_uris:
    sptribs-frontend:
      - https://${SERVICE_FQDN}/receiver
